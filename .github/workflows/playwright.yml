name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      CI: true
      ENV: qa
      PLAYWRIGHT_BROWSER_CHANNEL: chromium
      PLAYWRIGHT_HEADLESS: true
      PLAYWRIGHT_RETRIES: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ── 🚀 RUN TESTS SECURELY WITH CLOUD SECRETS INJECTED ──
      - name: Run Playwright tests
        run: npx playwright test
        env:
          # Maps your encrypted repository secrets directly to the terminal environment context
          PLAYGROUND_USERNAME: ${{ secrets.PLAYGROUND_USERNAME }}
          PLAYGROUND_PASSWORD: ${{ secrets.PLAYGROUND_PASSWORD }}
          ATS_USERNAME: ${{ secrets.ATS_USERNAME }}
          ATS_PASSWORD: ${{ secrets.ATS_PASSWORD }}
          PARABANK_USERNAME: ${{ secrets.PARABANK_USERNAME }}
          PARABANK_PASSWORD: ${{ secrets.PARABANK_PASSWORD }}

      # Upload Monocart Report
      - name: Upload Monocart Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: monocart-report
          path: monocart-report/
          retention-days: 30

      # Upload Playwright HTML report
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30

      # Upload Playwright test results
      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 30
